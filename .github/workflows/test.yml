name: Tests

on:
    pull_request:
        types: [opened, reopened, synchronize]
        branches:
            - dev
            - main
    push:
        branches:
            - dev
            - main

jobs:
    test-conventional-commit:
        name: Validate PR title
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # only on PRs
              if: github.event_name == 'pull_request'
    run-tests:
        name: All tests
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        env:
            BROWSER: chrome
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: All tests
              run: npm run test
            - name: Upload coverage
              uses: codecov/codecov-action@v5
              with:
                  fail_ci_if_error: false
                  codecov_yml_path: ./.github/codecov.yml
                  token: ${{ secrets.CODECOV_TOKEN }}
    test-code-examples:
        name: Check typedocs
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build Docs
              run: npm run build && npm run docs:json
            - name: tsdoc @example checks
              run: npm run test:examples
    test-html-examples:
        name: Run HTML Examples
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Code example tests
              run: npm run test:html
            # Abloh. It runs last, so it measures inside the tree the steps above just built -
            # it installs nothing of its own and rebuilds nothing. Until this pull request is
            # merged it reports and gates nothing. Pinned to a commit; a tag can be moved.
            - name: Abloh
              uses: kkennethlau12393/abloh-action-census@16880b00dc96dfd9cd28920e4ea142bea21f0368
              with:
                # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run MEASURES NOTHING. It walks every
                # stage past its first wall and writes the wall ledger, so a repository is not known
                # only by the first thing that stopped it. No verdict comes from this run.
                sweep: 'true'
                # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run measures a build of the product
                # rather than the published CLI. Recorded in every row this workflow produced.
                cli-tarball: .abloh-census/engine/abloh-cli-0.1.4.tgz .abloh-census/engine/abloh-core-0.1.3.tgz .abloh-census/engine/abloh-engine-python-0.1.2.tgz .abloh-census/engine/abloh-engine-stryker-0.1.3.tgz .abloh-census/engine/abloh-engine-v2-0.1.0.tgz .abloh-census/engine/abloh-replay-0.1.0.tgz .abloh-census/engine/abloh-sandbox-0.1.2.tgz .abloh-census/engine/abloh-stryker-angular-runner-0.1.0.tgz .abloh-census/engine/abloh-stryker-ava-runner-0.1.0.tgz .abloh-census/engine/abloh-stryker-bun-runner-0.1.0.tgz .abloh-census/engine/abloh-stryker-node-test-runner-0.1.0.tgz .abloh-census/engine/abloh-triage-0.1.2.tgz
                base: ${{ github.event.pull_request.base.sha }}
            # ---------------------------------------------------------------------------------
            # ADDED BY THE ABLOH FIRST-CONTACT CENSUS, and these are the only lines of this file
            # that are not what `abloh init` wrote. It keeps the run's own artifact so the
            # census can classify from evidence rather than from this job's log. It runs after
            # everything Abloh does and cannot reach what was measured.
            # ---------------------------------------------------------------------------------
            - name: census - keep the run artifact
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                name: abloh-census-evidence-${{ github.job }}-${{ strategy.job-index }}
                path: |
                  ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-results.json
                  ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-summary.md
                  ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-engine-v2-proofs.json
                  ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep.json
                  ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-summary.json
                  ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-preceding-refusal.json
                if-no-files-found: ignore
                retention-days: 30
    test-lint:
        name: Linting and environment checks
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Linting
              run: npm run lint
            - name: Spell check
              run: npm run spellcheck
    test-readme:
        name: Ensure that examples in the README compile
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Test
              run: npm run test:readme
    test-integrations:
        name: Test integrations
        permissions:
            contents: read
            id-token: write
        runs-on: ubuntu-latest
        needs: [test-conventional-commit]
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: "npm"
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Test
              run: npm run test:integrations
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        # make sure all the tests pass first
        needs:
            [
                run-tests,
                test-code-examples,
                test-html-examples,
                test-lint,
                test-readme,
                test-integrations,
            ]
        # not on PRs
        if: github.event_name != 'pull_request'
        env:
            GITHUB_CI: true
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: "https://registry.npmjs.org"
            # Need to unset this in order to use OICD
            - name: Unset NODE_AUTH_TOKEN
              run: unset NODE_AUTH_TOKEN
            - name: Install dependencies
              run: npm install
            - name: Build
              run: npm run build
            - name: Increment version
              run: npm run increment
            - name: Publish @next
              # dev branch gets published with @next tag
              run: npm publish --tag next --provenance --access public
              if: ${{ github.ref == 'refs/heads/dev' }}
            - name: Publish @latest
              # main branch gets published with @latest tag
              run: npm publish --provenance --access public
              if: ${{ github.ref == 'refs/heads/main' }}
